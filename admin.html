<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artashop Ez — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff9ff;color:#21425b;font-family:Tahoma,"Noto Sans Thai",sans-serif}.top{padding:18px 5%;background:white;border-bottom:1px solid #d9edf7;display:flex;justify-content:space-between;align-items:center;gap:12px}.top b{font-size:21px}.top span{color:#168ed5}.btn{border:0;border-radius:10px;padding:10px 14px;background:#168ed5;color:#fff;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.stat,.box{background:white;border:1px solid #d9edf7;border-radius:16px;padding:18px;box-shadow:0 6px 22px #2e7ca20b}.stat small{color:#7893a7}.stat strong{display:block;font-size:28px;color:#168ed5;margin-top:6px}h2{font-size:20px;margin:0 0 14px}.box{margin-top:18px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf4f8;white-space:nowrap}th{color:#628096;background:#f7fcff}select{border:1px solid #cfe5f2;border-radius:8px;padding:7px}#msg{color:#1685bd;font-size:13px;margin:12px 0}@media(max-width:600px){.top{padding:14px}.stats{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style></head><body><header class="top"><b>☁ Artashop <span>Ez</span> / Admin</b><button class="btn" id="logout">ออกจากระบบ</button></header><main class="wrap"><h1>แผงควบคุมผู้ดูแล</h1><p>ข้อมูลสมาชิกและคำสั่งซื้อที่บันทึกผ่าน API</p><div id="msg" role="status"></div><div class="stats"><div class="stat"><small>สมาชิกทั้งหมด</small><strong id="usersCount">—</strong></div><div class="stat"><small>คำสั่งซื้อทั้งหมด</small><strong id="ordersCount">—</strong></div></div><section class="box"><h2>สมาชิก</h2><table><thead><tr><th>ID</th><th>ชื่อ</th><th>อีเมล</th><th>สิทธิ์</th><th>วันที่สมัคร</th></tr></thead><tbody id="users"></tbody></table></section><section class="box"><h2>คำสั่งซื้อ</h2><table><thead><tr><th>เลขที่</th><th>สมาชิก</th><th>รายการ</th><th>ราคา</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody id="orders"></tbody></table></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/admin/summary');if(r.status===401||r.status===403){location.href='/';return}const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดข้อมูลไม่สำเร็จ');document.getElementById('usersCount').textContent=d.stats.users;document.getElementById('ordersCount').textContent=d.stats.orders;document.getElementById('users').innerHTML=d.users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.created_at)}</td></tr>`).join('')||'<tr><td colspan="5">ยังไม่มีสมาชิก</td></tr>';document.getElementById('orders').innerHTML=d.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.username)}</td><td>${esc(o.item_name)}</td><td>${Number(o.amount).toLocaleString('th-TH')} ฿</td><td><select data-order="${o.id}"><option value="pending" ${o.status==='pending'?'selected':''}>รอดำเนินการ</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>ยืนยันแล้ว</option><option value="completed" ${o.status==='completed'?'selected':''}>เสร็จสิ้น</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>ยกเลิก</option></select></td><td>${esc(o.created_at)}</td></tr>`).join('')||'<tr><td colspan="6">ยังไม่มีคำสั่งซื้อ</td></tr>';document.querySelectorAll('[data-order]').forEach(s=>s.onchange=async()=>{const r=await fetch('/api/admin/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(s.dataset.order),status:s.value})});const v=await r.json();document.getElementById('msg').textContent=v.message||v.error||'';});}catch(e){document.getElementById('msg').textContent=e.message}}
document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
